# =============================================================================
# SIH26170 Synthetic Data Engine Configuration
# =============================================================================
# All numerical parameters in this file are SYNTHETIC MODELLING ASSUMPTIONS
# for testing and demonstration. They are NOT real ISRO or component datasheet
# limits. SIH26170 does not specify numerical component limits.
# =============================================================================

synthetic_generator_config:
  generator_version: "v2.0.0-phase1"
  random_seed: 42

  # -------------------------------------------------------
  # Dataset sizes — development/demo configuration choices,
  # not scientifically mandated sample sizes.
  # -------------------------------------------------------
  dataset_sizes:
    dev:
      num_lots: 20
      components_per_lot: 100
    demo:
      num_lots: 5
      components_per_lot: 50

  # -------------------------------------------------------
  # Hierarchical variance structure
  # sigma_lot_ratio: fraction of total variance from lot-level shifts
  # sigma_comp_ratio: fraction from intra-lot component variation
  # (synthetic modelling assumptions)
  # -------------------------------------------------------
  variance_structure:
    sigma_lot_ratio: 0.3
    sigma_comp_ratio: 0.7

  # -------------------------------------------------------
  # Class prevalence — applied independently.
  # behavioral_state and anomaly_attributes are separate axes.
  # -------------------------------------------------------
  class_prevalence:
    nominal_state_pct: 0.88
    latent_degradation_pct: 0.12
    population_anomaly_attr_pct: 0.06     # independent of behavioral state
    reference_limit_breach_attr_pct: 0.03 # independent of behavioral state

  # -------------------------------------------------------
  # Latent degradation — early detectability distribution.
  # Governs how obvious the 0h->24h signal is per component.
  # -------------------------------------------------------
  latent_degradation:
    early_detectability_distribution:
      hidden: 0.40     # Nearly undetectable at 24h; large later drift
      subtle: 0.30     # Slightly elevated Delta_24_0
      moderate: 0.20   # Clearly elevated Delta_24_0
      strong: 0.10     # Obviously steep early slope

  # -------------------------------------------------------
  # Anomaly severity scale.
  # Multiplier on intra-lot sigma for population anomaly shifts.
  # (synthetic modelling assumptions)
  # -------------------------------------------------------
  severity_scale:
    mild: 2.0
    moderate: 3.5
    strong: 5.0
    severe: 7.5

  # -------------------------------------------------------
  # Cross-parameter correlation matrix R (dimensionless).
  # Order: [Iddq, leakage_current, propagation_delay]
  # R must be symmetric and positive semi-definite.
  # Entries are SYNTHETIC MODELLING ASSUMPTIONS — they do not
  # represent empirically validated semiconductor physics.
  # The physical covariance Sigma is derived as Sigma = D R D
  # where D = diag(global_sigma for each parameter).
  # -------------------------------------------------------
  cross_parameter_correlation:
    R_matrix:
      - [1.00, 0.65, 0.40]
      - [0.65, 1.00, 0.30]
      - [0.40, 0.30, 1.00]

  # -------------------------------------------------------
  # Per-parameter configuration.
  # synthetic_spec_min/max: configurable synthetic reference
  # scenario limits for testing only. NOT real datasheet limits.
  # -------------------------------------------------------
  parameters:
    Iddq:
      unit: "uA"
      global_mean: 10.0
      global_sigma: 2.0       # used in D to construct Sigma = D R D
      synthetic_spec_min: 0.0
      synthetic_spec_max: 50.0
      nominal_noise_std: 0.15
      trajectory_family:
        nominal: "stable_mild"
        latent_degradation: "accelerating_v2"
      accelerating_exponent: 2.5
      stable_mild_k: 0.5      # scale factor for stable_mild trajectory
      stable_mild_t0: 24.0    # time constant for stable_mild
      latent_drift_k: 1.8     # scale factor for accelerating trajectory

    leakage_current:
      unit: "nA"
      global_mean: 5.0
      global_sigma: 0.8
      synthetic_spec_min: 0.0
      synthetic_spec_max: 30.0
      nominal_noise_std: 0.08
      trajectory_family:
        nominal: "stable_mild"
        latent_degradation: "accelerating_v2"
      accelerating_exponent: 2.0
      stable_mild_k: 0.15
      stable_mild_t0: 24.0
      latent_drift_k: 0.6

    propagation_delay:
      unit: "ps"
      global_mean: 120.0
      global_sigma: 8.0
      synthetic_spec_min: 80.0
      synthetic_spec_max: 180.0
      nominal_noise_std: 0.8
      trajectory_family:
        nominal: "stable_mild"
        latent_degradation: "accelerating_v2"  # slower drift for delay
      accelerating_exponent: 1.8
      stable_mild_k: 1.2
      stable_mild_t0: 48.0
      latent_drift_k: 0.8
